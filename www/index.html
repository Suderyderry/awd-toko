/* ===== Cetak struk (printer thermal 58 mm: Bluetooth BLE ESC/POS, cadangan: dialog cetak sistem) ===== */
function struk(o){const W=32,ln=(l,r)=>{l=String(l);r=String(r);return l+' '.repeat(Math.max(1,W-l.length-r.length))+r},c=t=>' '.repeat(Math.max(0,(W-t.length)>>1))+t,sp='-'.repeat(W),a=t=>String(t==null?'':t).normalize('NFD').replace(/[^\x20-\x7e]/g,'');
 const L=[c(a(S.toko.nama).slice(0,W)),c(a(S.toko.adr).slice(0,W)),sp,a(o.id)+'  '+a(wkt(o)),'Pelanggan: '+a(o.c).slice(0,W-11),sp];
 (o.items||[]).forEach(i=>{L.push(a(i.n).slice(0,W));L.push(ln('  '+i.q+' x '+num(i.h),num(i.h*i.q)))});
 L.push(sp,ln('Subtotal',num(o.sub)),ln('Ongkir',num(o.fee)),ln('Biaya layanan',num(o.sf)),ln('TOTAL',num(o.p)),sp,'Bayar: '+a(String(o.pay||'cod')).toUpperCase());if(o.note)L.push('Catatan: '+a(o.note));L.push(sp,c('Terima kasih'),c(a(CF.ft).slice(0,W)));return L.join('\n')}
const enc=t=>{const b=[0x1b,0x40,0x1b,0x61,0x00];for(const ch of t)b.push(ch.charCodeAt(0)&0x7f);b.push(10,10,10,0x1d,0x56,0x42,0);return new Uint8Array(b)};
let PD=null,PC=null;
async function btPrint(by){if(!navigator.bluetooth)throw new Error('Bluetooth web tidak tersedia');
 if(!PC||!PD||!PD.gatt.connected){PD=PD||await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb',0xff00,'e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455']});const g=await PD.gatt.connect();PC=null;
  for(const sv of await g.getPrimaryServices()){for(const ch of await sv.getCharacteristics()){if(ch.properties.write||ch.properties.writeWithoutResponse){PC=ch;break}}if(PC)break}if(!PC)throw new Error('Printer tidak mendukung penulisan BLE')}
 for(let i=0;i<by.length;i+=20){const p=by.slice(i,i+20);PC.properties.writeWithoutResponse?await PC.writeValueWithoutResponse(p):await PC.writeValue(p);await new Promise(r=>setTimeout(r,20))}}
function sysPrint(t){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write('<pre style="font:12px/1.25 monospace;width:58mm;margin:0">'+t.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>');d.close();f.contentWindow.focus();f.contentWindow.print();setTimeout(()=>f.remove(),4000)}
async function cetak(id){const o=S.pesanan.find(x=>x.id===id);if(!o)return;const t=struk(o);try{await btPrint(enc(t));toast('Struk dikirim ke printer')}catch(e){if(e&&e.name==='NotFoundError')return toast('Pemilihan printer dibatalkan');try{sysPrint(t);toast('Membuka dialog cetak…')}catch(x){toast('Gagal mencetak: '+(e.message||x.message))}}}

async function lk(){try{S.lk=await call('awd_mitra_lacak',{id:S.oid});if(S.sub==='lacak'){R();drawMap('mpk',trkK(S.lk))}}catch(e){toast(e.message)}}

function mapSVG(L){const P=[['T',L.toko],['C',L.tujuan],['D',L.driver]].filter(x=>x[1]&&x[1].lat!=null&&x[1].lng!=null);if(P.length<2)return'';
 const la=P.map(x=>+x[1].lat),lo=P.map(x=>+x[1].lng),a=Math.min(...la),b=Math.max(...la),c=Math.min(...lo),d=Math.max(...lo),sx=Math.max(d-c,1e-4),sy=Math.max(b-a,1e-4),pt=q=>[34+(q.lng-c)/sx*272,166-(q.lat-a)/sy*132],g={};P.forEach(x=>g[x[0]]=pt(x[1]));
 const ln=(p,q,dash)=>p&&q?`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--g)" stroke-width="2" ${dash?'stroke-dasharray="5 4"':'opacity=".25"'}/>`:'';
 const ic={T:'🏪',C:'🏠',D:'🛵'};
 return `<div class="card"><svg viewBox="0 0 340 200" width="100%" role="img" aria-label="Sketsa posisi driver" style="background:var(--bg);border-radius:10px">${ln(g.T,g.C,0)}${ln(g.D,L.fase==='antar'?g.C:g.T,1)}${P.map(x=>`<text x="${g[x[0]][0]}" y="${g[x[0]][1]}" font-size="26" text-anchor="middle" dominant-baseline="central">${ic[x[0]]}</text>`).join('')}</svg><div class="m">Sketsa posisi relatif: toko 🏪, pelanggan 🏠, driver 🛵. Untuk peta jalan, buka Google Maps.</div></div>`}
function lacakV(){const o=S.pesanan.find(x=>x.id===S.oid)||{},L=S.lk;let b='<div class="card m">Memuat posisi driver…</div>';
 if(L&&L.fase==='cari')b='<div class="card">Driver belum ditugaskan. Sistem sedang mencarikan driver untuk pesanan ini.</div>';
 else if(L){const d=L.driver||{},ok=d.lat!=null&&d.lng!=null,tel=String(d.hp||'').replace(/[^0-9+]/g,'');
  b=`<div class="card"><b>${L.fase==='antar'?'Driver sedang mengantar pesanan':'Driver menuju toko untuk pickup'}</b>${d.sisa?`<div class="m">Estimasi tiba ± ${d.sisa} menit</div>`:''}</div>${ok?'<div class="card"><div id="mpk" class="mapb"></div></div>':'<div class="card m">Posisi driver belum tersedia.</div>'}<div class="card r sp"><div><b>${E(d.nama||'')}</b><div class="m">${E(d.plat||'')}${d.hp?' · '+E(d.hp):''}</div></div>${tel?`<a class="btn o s" href="tel:${tel}" style="text-decoration:none">Telepon</a>`:''}</div>${ok?`<a class="btn b" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${d.lat},${d.lng}">Buka di Google Maps</a>`:''}`}
 return tp('Lacak '+E(o.id||''),"clearInterval(LT);S.sub=null;R()")+`<div class="w">${b}</div>`}
async function ps(id,s){try{await call('awd_mitra_pesanan_status',{id,s});S.pesanan=await call('awd_mitra_pesanan');try{S.stat=await call('awd_mitra_statistik')}catch(e){}R()}catch(e){toast(e.message)}}

 <button class="btn o b" style="margin-bottom:8px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Ganti tema</button><button class="btn x b" onclick="logout()">Keluar</button></div>`}
function R(){let h;if(!S.user)h=authV();else if(S.sub==='form')h=formP(S.fid);else if(S.sub==='saldo')h=saldoV();else if(S.sub==='notif')h=notifV();else if(S.sub==='det')h=detV();else if(S.sub==='lacak')h=lacakV();else h={home,set:setV,akt,chat,prof}[S.tab]();
 const n=[['home','🏠','Beranda'],['set','⚙️','Pengaturan'],['akt','🧾','Aktivitas'],['chat','💬','Chat'],['prof','🏪','Profil Toko']];
 $.innerHTML=h+(S.ring?ringV():'')+(S.user&&!S.sub?`<div class="nvw"><nav>${n.map(x=>`<button class="${S.tab===x[0]?'on':''}" onclick="S.tab='${x[0]}';S.ct=null;S.cc=null;R();if('${x[0]}'==='chat')loadChats().then(R)"><i>${x[1]}</i>${x[2]}${x[0]==='chat'&&S.cun?` <span class="chip" style="color:var(--er)">${S.cun}</span>`:''}</button>`).join('')}</nav><div class="ft">${E(CF.ft)}</div></div>`:'');}

/* ===== Peta lokasi (tile OpenStreetMap, tanpa pustaka tambahan) ===== */
const llv=o=>o&&o.lat!=null&&o.lng!=null&&isFinite(+o.lat)&&isFinite(+o.lng)?{lat:+o.lat,lng:+o.lng}:null;
function trkK(L){if(!L)return[];const d=L.driver||{};return[[L.toko,'🏪','Toko'],[L.tujuan,'🏠','Tujuan'],[d,'🛵',d.nama||'Driver']].map(a=>{const q=llv(a[0]);return q?{...q,e:a[1],l:a[2]}:null}).filter(Boolean)}
function drawMap(id,pts){const el=document.getElementById(id);if(!el)return;if(!pts.length){el.innerHTML='<div class="m" style="display:grid;place-items:center;height:100%;text-align:center;padding:14px">Lokasi belum tersedia.</div>';return}
const W=el.clientWidth||320,H=el.clientHeight||210,P=36,n0=z=>Math.pow(2,z)*256,mx=(g,z)=>(g+180)/360*n0(z),my=(a,z)=>{const r=a*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n0(z)};
let z=17;for(;z>9;z--){const xs=pts.map(p=>mx(p.lng,z)),ys=pts.map(p=>my(p.lat,z));if(Math.max(...xs)-Math.min(...xs)<=W-2*P&&Math.max(...ys)-Math.min(...ys)<=H-2*P)break}
const xs=pts.map(p=>mx(p.lng,z)),ys=pts.map(p=>my(p.lat,z)),ox=(Math.min(...xs)+Math.max(...xs))/2-W/2,oy=(Math.min(...ys)+Math.max(...ys))/2-H/2,n=Math.pow(2,z);
let t='';for(let tx=Math.floor(ox/256);tx<=Math.floor((ox+W)/256);tx++)for(let ty=Math.floor(oy/256);ty<=Math.floor((oy+H)/256);ty++){if(ty<0||ty>=n)continue;t+=`<img src="https://tile.openstreetmap.org/${z}/${((tx%n)+n)%n}/${ty}.png" alt="" draggable="false" style="position:absolute;left:${tx*256-ox}px;top:${ty*256-oy}px;width:256px;height:256px;max-width:none">`}
const mk=pts.map(p=>`<div style="position:absolute;left:${mx(p.lng,z)-ox}px;top:${my(p.lat,z)-oy}px;transform:translate(-50%,-100%);text-align:center;pointer-events:none"><div style="font-size:26px;line-height:1;filter:drop-shadow(0 2px 3px #0008)">${p.e}</div><div style="font:700 10px system-ui;background:#fff;color:#0f172a;border-radius:6px;padding:1px 5px;margin-top:2px;white-space:nowrap">${E(p.l)}</div></div>`).join('');
el.innerHTML=t+mk+'<div style="position:absolute;right:4px;bottom:2px;font:9px system-ui;background:#fffc;padding:0 4px;border-radius:4px;color:#334">© OpenStreetMap</div>'}
if(live())refreshTK().then(ok=>{if(ok)boot()});setInterval(()=>{if(S.user)refreshTK()},40*60000);setInterval(()=>{if(S.user&&!S.sub){const a=document.activeElement;loadCF().then(()=>{if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))R()})}},120000);
